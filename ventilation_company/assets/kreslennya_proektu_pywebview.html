  canvas.addEventListener('mousedown', function(e) {
    canvas.focus();
    const rect = canvas.getBoundingClientRect();
    if (!rect || rect.width === 0 || rect.height === 0) return;
    let wx = (e.clientX - rect.left - offsetX) / scale;
    let wy = (e.clientY - rect.top - offsetY) / scale;
    if (!Number.isFinite(wx) || !Number.isFinite(wy)) { console.warn('Invalid mouse coordinates'); return; }
    if (['wall', 'vent', 'dimension', 'window', 'door', 'vent_equip'].includes(currentTool)) {
      const sp = findSnap(wx, wy);
      if (sp) { wx = sp.x; wy = sp.y; }
    }
    wx = snap(wx); wy = snap(wy);

    if (currentTool === 'select') {
      const el = getElementAt(wx, wy);
      if (el) { selectedId = el.id; updateProps(); draw(); if (['window', 'door', 'vent_equip'].includes(el.type)) { draggingElement = el; dragOffset = { x: wx - el.x, y: wy - el.y }; } return; }
      isPanning = true; panStart = { x: e.clientX, y: e.clientY, ox: offsetX, oy: offsetY };
    }
    if (currentTool === 'wall') {
      if (!tempShape) { tempShape = { type: 'wall', x1: wx, y1: wy, x2: wx, y2: wy, thickness: 6, id: 'temp' }; }
      else { saveState(); elements.push({ type: 'wall', x1: tempShape.x1, y1: tempShape.y1, x2: wx, y2: wy, thickness: 6, id: idCounter++ }); saveIdCounterToStorage(); tempShape = null; draw(); }
    }
    if (currentTool === 'vent') {
      if (!tempShape) {
        if (currentDuctShape === 'rect') {
          tempShape = { type: 'vent', x1: wx, y1: wy, x2: wx, y2: wy, shape: 'rect', rectW: 160, rectH: 100, ventType: 'supply', airflow: 100, system: 'П1', name: '', id: 'temp' };
        } else {
          tempShape = { type: 'vent', x1: wx, y1: wy, x2: wx, y2: wy, shape: 'round', ventType: 'supply', diameter1: 160, diameter2: 160, airflow: 100, system: 'П1', name: '', id: 'temp' };
        }
      } else {
        saveState();
        const base = { type: 'vent', x1: tempShape.x1, y1: tempShape.y1, x2: wx, y2: wy, ventType: tempShape.ventType, system: tempShape.system, name: tempShape.name || '', id: idCounter++ };
        if (tempShape.shape === 'rect') {
          base.shape = 'rect'; base.rectW = tempShape.rectW; base.rectH = tempShape.rectH;
        } else {
          base.shape = 'round'; base.diameter1 = tempShape.diameter1; base.diameter2 = tempShape.diameter2; base.airflow = tempShape.airflow;
        }
        elements.push(base); saveIdCounterToStorage(); tempShape = null; draw();
      }
    }
    if (currentTool === 'dimension') {
      if (!tempShape) { tempShape = { type: 'dimension', x1: wx, y1: wy, x2: wx, y2: wy, id: 'temp' }; }
      else { saveState(); elements.push({ type: 'dimension', x1: tempShape.x1, y1: tempShape.y1, x2: wx, y2: wy, id: idCounter++ }); saveIdCounterToStorage(); tempShape = null; draw(); }
    }
    if (currentTool === 'window') { saveState(); elements.push({ type: 'window', x: wx, y: wy, width: 60, height: 8, rotation: 0, name: 'Вікно ' + idCounter, id: idCounter++ }); saveIdCounterToStorage(); tempShape = null; draw(); }
    if (currentTool === 'door') { saveState(); elements.push({ type: 'door', x: wx, y: wy, width: 40, height: 6, rotation: 0, swing: 'right', direction: 'forward', name: 'Двері ' + idCounter, id: idCounter++ }); saveIdCounterToStorage(); tempShape = null; draw(); }
    if (currentTool === 'vent_equip') {
      saveState();
      const eqW = currentVentKind === 'fan' ? 50 : (currentVentKind === 'silencer' ? 80 : 60);
      const eqH = currentVentKind === 'fan' ? 50 : 40;
      const snapped = snapVentEquip(wx, wy, eqW, eqH);
      const base = { type: 'vent_equip', kind: currentVentKind, x: snapped.x, y: snapped.y, width: eqW, height: eqH, rotation: snapped.rotation, name: '', system: 'П1', airflow: 100, id: idCounter++ };
      if (currentVentKind === 'grille') { base.name = 'Решітка ' + base.id; base.width = 60; base.height = 40; base.ventType = 'supply'; }
      else if (currentVentKind === 'fan') { base.name = 'Вентилятор ' + base.id; base.width = 50; base.height = 50; base.power = 100; }
      else if (currentVentKind === 'silencer') { base.name = 'Глушитель ' + base.id; base.width = 80; base.height = 40; }
      else if (currentVentKind === 'damper') { base.name = 'Клапан ' + base.id; base.width = 60; base.height = 40; base.openAngle = 45; }
      elements.push(base); saveIdCounterToStorage(); draw();
    }
    if (currentTool === 'custom_draw') {
      if (!tempShape) {
        const tpl = currentCustomTemplate || { name: 'Елемент', color: '#9b59b6' };
        tempShape = { type: 'custom_draw', x1: wx, y1: wy, x2: wx, y2: wy, name: tpl.name, symbolColor: tpl.color, id: 'temp' };
      } else {
        saveState();
        const cx = (tempShape.x1 + tempShape.x2) / 2, cy = (tempShape.y1 + tempShape.y2) / 2;
        const w = Math.abs(tempShape.x2 - tempShape.x1), h = Math.abs(tempShape.y2 - tempShape.y1);
        const tplPath = currentCustomTemplate && currentCustomTemplate.symbolPath ? JSON.parse(JSON.stringify(currentCustomTemplate.symbolPath)) : [];
        const snapped = snapVentEquip(cx, cy, Math.max(20, w), Math.max(20, h));
        elements.push({ type: 'vent_equip', kind: 'custom', x: snapped.x, y: snapped.y, width: Math.max(20, w), height: Math.max(20, h), rotation: snapped.rotation, name: tempShape.name + ' ' + idCounter, system: 'П1', airflow: 100, symbolPath: tplPath, symbolColor: tempShape.symbolColor, id: idCounter++ }); saveIdCounterToStorage();
        tempShape = null; currentTool = 'select'; currentVentKind = null; currentCustomTemplate = null;
        deactivateAllTools();
        document.querySelector('.tool-btn[data-tool="select"]').classList.add('active');
        toolHint.textContent = 'Клікніть на елемент, щоб вибрати. Перетягніть для панорами.';
        draw();
      }
    }
    if (currentTool === 'callout') {
      if (!tempShape) {
        tempShape = { type: 'callout', x1: wx, y1: wy, x2: wx, y2: wy, text: '', fontSize: 12, id: 'temp' };
      } else {
        const text = prompt('Текст виноски:', 'Примітка');
        if (text !== null) {
          saveState();
          elements.push({ type: 'callout', x1: tempShape.x1, y1: tempShape.y1, x2: wx, y2: wy, text: text, fontSize: 12, id: idCounter++ });
          saveIdCounterToStorage();
        }
        tempShape = null; draw();
      }
    }
    if (currentTool === 'delete') {
      const el = getElementAt(wx, wy);
      if (el) { saveState(); elements = elements.filter(function(e) { return e.id !== el.id; }); if (selectedId === el.id) selectedId = null; updateProps(); draw(); }
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    let wx = (e.clientX - rect.left - offsetX) / scale;
    let wy = (e.clientY - rect.top - offsetY) / scale;
    if (['wall', 'vent', 'dimension', 'window', 'door', 'vent_equip'].includes(currentTool) || currentTool === 'select') {
      const sp = findSnap(wx, wy, draggingElement ? draggingElement.id : null);
      if (sp && (!snapPoint || snapPoint.x !== sp.x || snapPoint.y !== sp.y)) { snapPoint = sp; draw(); }
      else if (!sp && snapPoint) { snapPoint = null; draw(); }
    }
    let snappedWx = wx, snappedWy = wy;
    if (['wall', 'vent', 'dimension', 'window', 'door', 'vent_equip'].includes(currentTool)) {
      const sp = findSnap(wx, wy); if (sp) { snappedWx = sp.x; snappedWy = sp.y; }
    }
    snappedWx = snap(snappedWx); snappedWy = snap(snappedWy);
    coordsEl.textContent = 'X: ' + snappedWx.toFixed(0) + ' | Y: ' + snappedWy.toFixed(0);
    if (draggingElement) { draggingElement.x = snap(wx - dragOffset.x); draggingElement.y = snap(wy - dragOffset.y); draw(); return; }
    if (isPanning && panStart) { offsetX = panStart.ox + (e.clientX - panStart.x); offsetY = panStart.oy + (e.clientY - panStart.y); draw(); return; }
    if (currentTool === 'vent_equip' || (currentTool === 'custom_draw' && currentVentKind === 'custom')) {
      const eqW = currentTool === 'vent_equip' ? (currentVentKind === 'fan' ? 50 : (currentVentKind === 'silencer' ? 80 : 60)) : (currentCustomTemplate ? 60 : 60);
      const eqH = currentTool === 'vent_equip' ? (currentVentKind === 'fan' ? 50 : 40) : (currentCustomTemplate ? 40 : 40);
      const snapped = snapVentEquip(wx, wy, eqW, eqH);
      tempShape = { type: 'vent_equip', kind: currentVentKind || 'custom', x: snapped.x, y: snapped.y, width: eqW, height: eqH, rotation: snapped.rotation, name: 'Preview', system: 'П1', airflow: 100, id: 'temp' };
      if (currentVentKind === 'custom' && currentCustomTemplate) {
        tempShape.symbolPath = currentCustomTemplate.symbolPath;
        tempShape.symbolColor = currentCustomTemplate.color;
      }
      draw();
      canvas.style.cursor = 'crosshair';
    } else if (currentTool === 'window') {
      tempShape = { type: 'window', x: snappedWx, y: snappedWy, width: 60, height: 8, rotation: 0, name: 'Preview', id: 'temp' };
      draw(); canvas.style.cursor = 'crosshair';
    } else if (currentTool === 'door') {
      tempShape = { type: 'door', x: snappedWx, y: snappedWy, width: 40, height: 6, rotation: 0, swing: 'right', direction: 'forward', name: 'Preview', id: 'temp' };
      draw(); canvas.style.cursor = 'crosshair';
    } else if (currentTool === 'select') { const el = getElementAt(wx, wy); canvas.style.cursor = el ? 'pointer' : 'grab'; if (el && el.id !== hoverId) { hoverId = el.id; draw(); } else if (!el && hoverId) { hoverId = null; draw(); } }
    else { canvas.style.cursor = 'crosshair'; }
    if (tempShape && (currentTool === 'wall' || currentTool === 'vent' || currentTool === 'dimension' || currentTool === 'custom_draw' || currentTool === 'callout')) {
      // Орто-режим: прив'язка до 0°, 90°, 45° при малюванні
      if (tempShape.x1 !== undefined) {
        const dx = snappedWx - tempShape.x1;
        const dy = snappedWy - tempShape.y1;
        const angle = Math.atan2(dy, dx);
        const dist = Math.sqrt(dx*dx + dy*dy);
        // Прив'язка до найближчого кута: 0°, 45°, 90°, 135°, 180°...
        const snapAngle = Math.round(angle / (Math.PI/4)) * (Math.PI/4);
        tempShape.x2 = tempShape.x1 + dist * Math.cos(snapAngle);
        tempShape.y2 = tempShape.y1 + dist * Math.sin(snapAngle);
      } else {
        tempShape.x2 = snappedWx; tempShape.y2 = snappedWy;
      }
      draw();
    }
  });

  canvas.addEventListener('mouseup', function() {
    if (draggingElement) saveState();
    isPanning = false; panStart = null; draggingElement = null; dragOffset = null;
  });
  canvas.addEventListener('mouseleave', function() { isPanning = false; draggingElement = null; hoverId = null; snapPoint = null; tempShape = null; draw(); });
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = (mx - offsetX) / scale, wy = (my - offsetY) / scale;
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.max(0.01, Math.min(20, scale * delta));
    offsetX = mx - wx * scale; offsetY = my - wy * scale;
    draw();
  }, { passive: false });

  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    // Стрілки для пересування по кресленню
    if (e.key === 'ArrowLeft') { e.preventDefault(); offsetX += 30 * scale; draw(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); offsetX -= 30 * scale; draw(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); offsetY += 30 * scale; draw(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); offsetY -= 30 * scale; draw(); return; }
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undo(); return; }
    if (e.key === 'Enter' && tempShape && (tempShape.type === 'wall' || tempShape.type === 'vent')) {
      e.preventDefault();
      const dx = tempShape.x2 - tempShape.x1, dy = tempShape.y2 - tempShape.y1;
      const currentLen = Math.sqrt(dx*dx + dy*dy), currentAngle = Math.atan2(dy, dx);
      const input = prompt('Введіть довжину (мм):', currentLen.toFixed(0));
      if (input === null) return;
      const len = parseFloat(input);
      if (isNaN(len) || len <= 0) { alert('Некоректна довжина'); return; }
      const x2 = tempShape.x1 + len * Math.cos(currentAngle), y2 = tempShape.y1 + len * Math.sin(currentAngle);
      if (tempShape.type === 'wall') { saveState(); elements.push({ type: 'wall', x1: tempShape.x1, y1: tempShape.y1, x2: snap(x2), y2: snap(y2), thickness: 6, id: idCounter++ }); saveIdCounterToStorage(); }
      else if (tempShape.type === 'vent') { saveState(); elements.push({ type: 'vent', x1: tempShape.x1, y1: tempShape.y1, x2: snap(x2), y2: snap(y2), ventType: tempShape.ventType, diameter1: tempShape.diameter1, diameter2: tempShape.diameter2, airflow: tempShape.airflow, system: tempShape.system, name: tempShape.name, id: idCounter++ }); saveIdCounterToStorage(); }
      tempShape = null; draw();
    }
    if (e.key === 'Escape') {
      if (tempShape) { tempShape = null; draw(); }
      if (selectedId) { selectedId = null; updateProps(); draw(); }
      // Скидаємо інструмент на "вибір" і дозволяємо пересування
      currentTool = 'select';
      deactivateAllTools();
      document.querySelector('[data-tool="select"]').classList.add('active');
      canvas.style.cursor = 'grab';
      draw();
      return;
    }
  });

  document.getElementById('zoom-in').addEventListener('click', function() { scale = Math.min(20, scale * 1.5); draw(); });
  document.getElementById('zoom-out').addEventListener('click', function() { scale = Math.max(0.01, scale / 1.5); draw(); });
  document.getElementById('zoom-reset').addEventListener('click', function() { scale = 1; offsetX = 0; offsetY = 0; draw(); });
document.getElementById('zoom-fit').addEventListener('click', function() { 
    // Автоматичне масштабування, щоб вмістити все креслення
    var bounds = getDrawingBounds();
    if (bounds) {
        var padding = 50;
        var scaleX = (canvas.width - padding * 2) / bounds.width;
        var scaleY = (canvas.height - padding * 2) / bounds.height;
        scale = Math.max(0.01, Math.min(20, Math.min(scaleX, scaleY)));
        offsetX = canvas.width / 2 - (bounds.minX + bounds.width / 2) * scale;
        offsetY = canvas.height / 2 - (bounds.minY + bounds.height / 2) * scale;
        draw();
    }
});

  document.getElementById('print-btn').addEventListener('click', function() {
    window.print();
  });

  document.getElementById('save-img-btn').addEventListener('click', function() {
    const link = document.createElement('a');
    link.download = 'kreslennya.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('pdf-btn').addEventListener('click', function() {
    const dataUrl = canvas.toDataURL('image/png');
    const blob = new Blob(['<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Креслення проекту</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#fff;}img{max-width:100%;max-height:100%;}@media print{body{background:#fff;margin:0;}img{max-width:100%;max-height:100%;box-shadow:none;}}</style></head><body><img src="' + dataUrl + '" onload="setTimeout(function(){window.print();},400);"></body></html>'], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  });
  document.getElementById('clear-btn').addEventListener('click', function() { if (confirm('Очистити всі елементи?')) { saveState(); elements = []; selectedId = null; tempShape = null; updateProps(); draw(); } });
  document.getElementById('export-btn').addEventListener('click', function() {
    const data = JSON.stringify(elements, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'project_drawing.json'; a.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('save-file-btn').addEventListener('click', function() {
    const data = JSON.stringify(elements, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'kreslennya_project.json'; a.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('import-btn').addEventListener('click', function() { document.getElementById('file-input').click(); });
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) { saveState(); elements = data; const maxId = Math.max.apply(null, elements.map(function(el) { return el.id || 0; }).concat([0])); idCounter = maxId + 1; selectedId = null; updateProps(); draw(); alert('Проєкт завантажено успішно!'); }
      } catch (err) { alert('Помилка завантаження файлу'); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  elements.push(
    { type: 'wall', x1: 100, y1: 100, x2: 400, y2: 100, thickness: 6, id: idCounter++ },
    { type: 'wall', x1: 400, y1: 100, x2: 400, y2: 300, thickness: 6, id: idCounter++ },
    { type: 'wall', x1: 400, y1: 300, x2: 100, y2: 300, thickness: 6, id: idCounter++ },
    { type: 'wall', x1: 100, y1: 300, x2: 100, y2: 100, thickness: 6, id: idCounter++ },
    { type: 'wall', x1: 100, y1: 200, x2: 400, y2: 200, thickness: 6, id: idCounter++ },
    { type: 'window', x: 250, y: 100, width: 60, height: 8, rotation: 0, name: 'Вікно 1', id: idCounter++ },
    { type: 'window', x: 250, y: 200, width: 60, height: 8, rotation: 0, name: 'Вікно 2', id: idCounter++ },
    { type: 'door', x: 400, y: 150, width: 40, height: 6, rotation: 90, swing: 'right', direction: 'forward', name: 'Вхідні двері', id: idCounter++ },
    { type: 'door', x: 100, y: 250, width: 40, height: 6, rotation: 90, swing: 'left', direction: 'backward', name: 'Міжкімнатні', id: idCounter++ },
    { type: 'vent', x1: 150, y1: 150, x2: 250, y2: 150, ventType: 'supply', diameter1: 200, diameter2: 160, airflow: 120, system: 'П1', name: 'Приплив 1', id: idCounter++ },
    { type: 'vent', x1: 300, y1: 250, x2: 300, y2: 180, ventType: 'exhaust', diameter1: 160, diameter2: 125, airflow: 80, system: 'В1', name: 'Витяжка 1', id: idCounter++ },
    { type: 'dimension', x1: 100, y1: 80, x2: 400, y2: 80, offset: 30, id: idCounter++ },
    { type: 'vent_equip', kind: 'grille', x: 150, y: 100, width: 60, height: 40, rotation: 0, name: 'Решітка приплив', system: 'П1', airflow: 150, ventType: 'supply', id: idCounter++ },
    { type: 'vent_equip', kind: 'fan', x: 320, y: 150, width: 50, height: 50, rotation: 0, name: 'Вентилятор', system: 'П1', airflow: 200, power: 150, id: idCounter++ },
    { type: 'vent_equip', kind: 'silencer', x: 200, y: 250, width: 80, height: 40, rotation: 0, name: 'Глушитель', system: 'В1', airflow: 100, id: idCounter++ },
    { type: 'vent_equip', kind: 'damper', x: 350, y: 250, width: 60, height: 40, rotation: 0, name: 'Дросель', system: 'В1', airflow: 80, openAngle: 30, id: idCounter++ }
  );

  loadTemplatesFromStorage();
  loadIdCounterFromStorage();
  // Auto-load last saved project
  try {
    const autoData = localStorage.getItem('projectAutoSave');
    if (autoData) {
      const parsed = JSON.parse(autoData);
      if (Array.isArray(parsed) && parsed.length > 0) {
        if (confirm('Знайдено автоматично збережений проєкт. Завантажити його?')) {
          elements = parsed;
          const maxId = Math.max.apply(null, elements.map(function(el) { return el.id || 0; }).concat([0]));
          idCounter = maxId + 1;
        }
      }
    }
  } catch(e) {}
  history = [JSON.parse(JSON.stringify(elements))];
  historyIndex = 0;
  renderCustomButtons();


    document.getElementById('save-project-btn').addEventListener('click', async function() {
    if (!projectId) { alert('❌ projectId не встановлено!'); return; }
    try {
      const ok = await window.pywebview.api.save_drawing(projectId, JSON.stringify(elements));
      alert(ok ? '✅ Збережено в проєкт!' : '❌ Помилка збереження');
    } catch(e) {
      alert('❌ Помилка: ' + (e.message || e));
    }
  });
  document.getElementById('close-editor-btn').addEventListener('click', function() {
    if (isPyWebView) window.pywebview.api.close_editor();
    else window.close();
  });

    initPyWebView();
    setTimeout(function() { initPyWebView(); }, 500);
    resize(); draw();
  
})();
</script>
</body>
</html>
